[package]
name = "aufhebung"
version = "0.1.0"
edition = "2024"

[features]
# Tokio integration. Off by default, and adds no runtime dependency: every hook
# `Reactor` uses is public on `Display`, so the loop can also be written by hand
# against any reactor.
tokio = ["dep:tokio"]
# Image decoding, for `Display::add_image`. Off by default, because a program
# that builds its own pixels — including every other example here — has no use
# for a file format decoder.
image = ["dep:image"]

[dependencies]
# Only the two formats the bundled asset and its tests need. `image`'s own
# default feature set is fifteen codecs plus `rayon`, which works out at 120
# packages against 20 here, and it includes a complete AV1 encoder. To decode
# something else, depend on `image` yourself with the features you want: Cargo
# unifies them with this one, so that needs no fork of this crate.
image = { version = "0.25.10", optional = true, default-features = false, features = ["jpeg", "png"] }
kbvm = "0.2.0"
# `mm` for mapping the keymap and the shm pools, `fs` for `memfd_create` and
# `ftruncate` on the pool backing store. Neither pulls in another crate.
rustix = { version = "1.1.5", features = ["fs", "mm"] }
slotmap = "1.1.1"
thiserror = "2.0.21"
# Only for the `tokio` feature, which needs just `net` for `AsyncFd`.
tokio = { version = "1", optional = true, features = ["net"] }
wayland-client = { git = "https://github.com/Smithay/wayland-rs.git", rev = "ad7d6a9b366441769990de04425ea2371e8a0e53" }
wayland-protocols = { git = "https://github.com/Smithay/wayland-rs.git", rev = "ad7d6a9b366441769990de04425ea2371e8a0e53", features = [
    "client",
    "staging",
    "unstable",
] }

[dev-dependencies]
anyhow = "1.0.104"
rand = "0.9.2"
# The example's own needs on top of the optional dependency: `macros` for
# `#[tokio::main]`, `rt-multi-thread` for the runtime it expands to, and `time`
# for the interval.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

# The example is the crate's only consumer of the `tokio` feature, and also its
# only build-time check that the feature works, so it is not built without it.
[[example]]
name = "snake"
required-features = ["tokio"]

# Likewise the only consumer of the `image` feature.
[[example]]
name = "photo"
required-features = ["image"]
